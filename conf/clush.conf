# Configuration file for clush
#
# Please see man clush.conf(5)
#

[Main]
fanout: 64
connect_timeout: 15
command_timeout: 0
color: auto
fd_max: 8192
history_size: 100
maxrc: no
node_count: yes
verbosity: 1
# Since 1.11, $CFGDIR is expanded for each config directory of the search path
# (e.g. /etc/clustershell, $XDG_CONFIG_HOME/clustershell).
confdir: $CFGDIR/clush.conf.d

# Add always all remote hosts to known_hosts without confirmation
#ssh_user: root
#ssh_path: /usr/bin/ssh
#ssh_options: -oStrictHostKeyChecking=no
